name: AI validation
on:
  push:
    branches: [feature/multi-provider-ai]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination: ['generic/platform=iOS Simulator', 'platform=macOS']
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project AuraHealth.xcodeproj -scheme AuraHealth -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO build
